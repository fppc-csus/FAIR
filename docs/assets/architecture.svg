<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a5f"/></marker></defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">FAIR architecture and data flow</text>
<text x="40" y="830" font-size="14" fill="#475569">Data flow: Form 700 uploads and agenda syncs feed the pipeline; detection compares disclosures with agenda text in the same jurisdiction and filing window;</text>
<text x="40" y="852" font-size="14" fill="#475569">candidates are stored as conflicts and reviewed by investigators. Orange = hosting edge, green = Supabase, purple = third-party services.</text>
<line x1="150" y1="330" x2="400" y2="190" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="245" font-size="12" fill="#1e3a5f" text-anchor="middle">1. load app</text><line x1="580" y1="140" x2="660" y2="140" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="620.0" y="134.0" font-size="12" fill="#1e3a5f" text-anchor="middle">origin</text><line x1="260" y1="385" x2="340" y2="385" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="300.0" y="379.0" font-size="12" fill="#1e3a5f" text-anchor="middle">2. sign in</text><line x1="980" y1="360" x2="1080" y2="300" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="1030.0" y="324.0" font-size="12" fill="#1e3a5f" text-anchor="middle">Prisma</text><line x1="980" y1="420" x2="1080" y2="450" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="1030.0" y="429.0" font-size="12" fill="#1e3a5f" text-anchor="middle">archive</text><line x1="980" y1="395" x2="1380" y2="380" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="1180" y="372" font-size="12" fill="#1e3a5f" text-anchor="middle">weekly scrape</text><line x1="830" y1="460" x2="830" y2="600" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><line x1="980" y1="700" x2="1380" y2="565" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arr)"/><text x="1180" y="620" font-size="12" fill="#1e3a5f" text-anchor="middle">optional</text><rect x="40" y="330" width="220" height="110" rx="10" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/><text x="150.0" y="358" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Investigator browser</text><text x="150.0" y="380" font-size="12.5" text-anchor="middle" fill="#475569">React Router 7 SPA</text><text x="150.0" y="398" font-size="12.5" text-anchor="middle" fill="#475569">Tailwind 4</text><rect x="340" y="90" width="240" height="100" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="460.0" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Cloudflare</text><text x="460.0" y="140" font-size="12.5" text-anchor="middle" fill="#475569">DNS + TLS proxy</text><text x="460.0" y="158" font-size="12.5" text-anchor="middle" fill="#475569">custom domain</text><rect x="660" y="90" width="260" height="100" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="790.0" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">AWS Amplify Hosting</text><text x="790.0" y="140" font-size="12.5" text-anchor="middle" fill="#475569">static build/client</text><text x="790.0" y="158" font-size="12.5" text-anchor="middle" fill="#475569">amplify.yml, SPA rewrite</text><rect x="340" y="330" width="260" height="110" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="470.0" y="358" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Supabase Auth</text><text x="470.0" y="380" font-size="12.5" text-anchor="middle" fill="#475569">email + password sign-in</text><text x="470.0" y="398" font-size="12.5" text-anchor="middle" fill="#475569">JWT session</text><rect x="680" y="330" width="300" height="130" rx="10" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/><text x="830.0" y="358" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">FAIR API (Express 4)</text><text x="830.0" y="380" font-size="12.5" text-anchor="middle" fill="#475569">Railway service</text><text x="830.0" y="398" font-size="12.5" text-anchor="middle" fill="#475569">requireAdmin on every /api route</text><text x="830.0" y="416" font-size="12.5" text-anchor="middle" fill="#475569">node-cron scheduler</text><text x="830.0" y="434" font-size="12.5" text-anchor="middle" fill="#475569">rate limits, helmet</text><rect x="1080" y="250" width="240" height="100" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="1200.0" y="278" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Supabase PostgreSQL</text><text x="1200.0" y="300" font-size="12.5" text-anchor="middle" fill="#475569">Prisma ORM</text><text x="1200.0" y="318" font-size="12.5" text-anchor="middle" fill="#475569">conflicts, filings, agenda</text><rect x="1080" y="400" width="240" height="100" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="1200.0" y="428" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Supabase Storage</text><text x="1200.0" y="450" font-size="12.5" text-anchor="middle" fill="#475569">form700-uploads bucket</text><text x="1200.0" y="468" font-size="12.5" text-anchor="middle" fill="#475569">original XLSX / PDF</text><rect x="1380" y="120" width="200" height="110" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="1480.0" y="148" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Legistar Web API</text><text x="1480.0" y="170" font-size="12.5" text-anchor="middle" fill="#475569">events, items, matter</text><text x="1480.0" y="188" font-size="12.5" text-anchor="middle" fill="#475569">text, votes, attachments</text><rect x="1380" y="330" width="200" height="100" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="1480.0" y="358" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Apify Actor</text><text x="1480.0" y="380" font-size="12.5" text-anchor="middle" fill="#475569">finds agenda PDFs</text><text x="1480.0" y="398" font-size="12.5" text-anchor="middle" fill="#475569">(non-Legistar cities)</text><rect x="1380" y="520" width="200" height="90" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="1480.0" y="548" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Gemini (optional)</text><text x="1480.0" y="570" font-size="12.5" text-anchor="middle" fill="#475569">ambiguous 0.70-0.89</text><text x="1480.0" y="588" font-size="12.5" text-anchor="middle" fill="#475569">name matches only</text><rect x="680" y="600" width="300" height="190" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/><text x="830.0" y="628" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Processing pipeline (server/src)</text><text x="830.0" y="650" font-size="12.5" text-anchor="middle" fill="#475569">parsers/: Form 700 XLSX + PDF</text><text x="830.0" y="668" font-size="12.5" text-anchor="middle" fill="#475569">ingestion/: Legistar + Apify + PDF text</text><text x="830.0" y="686" font-size="12.5" text-anchor="middle" fill="#475569">detection/: eligibility, entity</text><text x="830.0" y="704" font-size="12.5" text-anchor="middle" fill="#475569">  matching, thresholds, persistence</text><text x="830.0" y="722" font-size="12.5" text-anchor="middle" fill="#475569">routes/: dashboard, review, reports</text>
