<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="crow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,6 L11,6 M11,0 L0,6 L11,12" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1180" fill="#f8fafc"/>
<text x="40" y="1000" font-size="22" font-weight="700" fill="#0f172a">FAIR entity relationship diagram (PostgreSQL on Supabase, Prisma schema)</text>
<text x="40" y="1030" font-size="14" fill="#475569">PK = primary key (orange), FK = foreign key (blue). Arrows point from the parent (one) to the child (many). Source of truth: server/prisma/schema.prisma.</text>
<text x="40" y="1082" font-size="14" fill="#475569">conflicts.politician_id → politicians; meetings.jurisdiction_id → jurisdictions; agenda_items.city_id → data_sources (Legistar/Apify source).</text><text x="40" y="1056" font-size="14" fill="#475569">schedule_* stands for four tables with the same filing/politician keys; their details JSON keeps every column of the original Form 700 row.</text>
