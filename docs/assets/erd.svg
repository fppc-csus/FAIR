ize="12.5" fill="#334155" font-family="Menlo, monospace">name, type</text><text x="52" y="132" font-size="12.5" fill="#334155" font-family="Menlo, monospace">legistar_client_id</text></g><g><rect x="40" y="220" width="280" height="164" rx="8" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/><rect x="40" y="220" width="280" height="30" rx="8" fill="#1e3a5f"/><rect x="40" y="240" width="280" height="10" fill="#1e3a5f"/><text x="52" y="241" font-size="15" font-weight="700" fill="#fff">data_sources</text><text x="52" y="272" font-size="12.5" fill="#b45309" font-family="Menlo, monospace">PK id uuid</text><text x="52" y="292" font-size="12.5" fill="#1d4ed8" font-family="Menlo, monospace">FK jurisdiction_id</text><text x="52" y="312" font-size="12.5" fill="#334155" font-family="Menlo, monospace">city_name, source_type</text><text x="52" y="332" font-size="12.5" fill="#334155" font-family="Menlo, monospace">legistar_base_url / start_url</text><text x="52" y="352" font-size="12.5" fill="#334155" font-family="Menlo, monospace">enabled, last_synced_at</text><text x="52" y="372" font-size="12.5" fill="#334155" font-family="Menlo, monospace">last_error</text></g><g><rect x="40" y="460" width="280" height="144" rx="8" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/><rect x="40" y="460" width="280" height="30" rx="8" fill="#1e3a5f"/><rect x="40" y="480" width="280" height="10" fill="#1e3a5f"/><text x="52" y="481" font-size="15" font-weight="700" fill="#fff">sync_logs / sync_job_runs</text><text x="52" y="512" font-size="12.5" fill="#b45309" font-family="Menlo, monospace">PK id uuid</text><text x="52" y="532" font-size="12.5" fill="#1d4ed8" font-family="Menlo, monospace">FK data_source_id</text><text x="52" y="552" font-size="12.5" fill="#1d4ed8" font-family="Menlo, monospace">FK job_run_id</text><text x="52" y="572" font-size="12.5" fill="#334155" font-family="Menlo, monospace">status, items_found</text><text x="52" y="592" font-size="12.5" fill="#334155" font-family="Menlo, mo